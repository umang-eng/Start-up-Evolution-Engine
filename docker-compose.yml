# ──────────────────────────────────────────────────────────────────
#  Start-up Evolution Engine — 4-Tier Production Architecture
# ──────────────────────────────────────────────────────────────────
#  1. data-infrastructure : PostgreSQL 16 + Redis 7
#  2. ai-infrastructure   : Ollama on the host (local model inference)
#  3. api-gateway         : FastAPI REST server (auth, metadata, proxy)
#  4. worker-engine       : Dedicated ARQ background task runner
#  5. frontend-service    : Next.js production build
# ──────────────────────────────────────────────────────────────────

services:

  # ── Tier 1: Data Infrastructure ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: see-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-startup_evolution}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - see-net

  redis:
    image: redis:7-alpine
    container_name: see-redis
    restart: always
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - see-net

  # ── Tier 2: API Gateway ────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api-gateway
    container_name: see-api-gateway
    restart: always
    ports:
      - "${API_EXTERNAL_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SERVICE_ROLE=api-gateway
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-startup_evolution}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma2:2b}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.2}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-4096}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-240}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-10m}
      - PIPELINE_STAGE_RETRIES=${PIPELINE_STAGE_RETRIES:-1}
      - PIPELINE_FAST_MODE=${PIPELINE_FAST_MODE:-true}
      - WHISPER_HOST=http://host.docker.internal:8080
      - WHISPER_TIMEOUT_SECONDS=${WHISPER_TIMEOUT_SECONDS:-180}
      - FFMPEG_BINARY=ffmpeg
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-39fca85521b7c191a0c4f8263152d24269e8ef81d11ff31ff215443210ef8abc}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - see-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health/liveness').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Tier 3: Worker Engine ──────────────────────────────────────
  worker-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker-engine
    container_name: see-worker-engine
    restart: always
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SERVICE_ROLE=worker-engine
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-startup_evolution}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma2:2b}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.2}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-4096}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-240}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-10m}
      - PIPELINE_STAGE_RETRIES=${PIPELINE_STAGE_RETRIES:-1}
      - PIPELINE_FAST_MODE=${PIPELINE_FAST_MODE:-true}
      - WHISPER_HOST=http://host.docker.internal:8080
      - WHISPER_TIMEOUT_SECONDS=${WHISPER_TIMEOUT_SECONDS:-180}
      - FFMPEG_BINARY=ffmpeg
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-39fca85521b7c191a0c4f8263152d24269e8ef81d11ff31ff215443210ef8abc}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - see-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Tier 4: Frontend Service ───────────────────────────────────
  frontend-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: see-frontend
    restart: always
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://api-gateway:8000}
      - NEXT_PUBLIC_STREAM_URL=${NEXT_PUBLIC_STREAM_URL:-http://api-gateway:8000}
    depends_on:
      - api-gateway
    networks:
      - see-net

# ── Shared Networks ────────────────────────────────────────────
networks:
  see-net:
    driver: bridge

# ── Persistent Volumes ────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
